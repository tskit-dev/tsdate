name: Publish Python release

on:
  push:
    branches: [test-publish]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-wheels:
    uses: tskit-dev/.github/.github/workflows/build-wheels.yml@v22
    with:
      # The shared default still lists macos-14, which GitHub no longer runs;
      # macos-15 is its Apple Silicon replacement.
      os-list: '["ubuntu-24.04", "windows-2025", "macos-15-intel", "macos-15"]'

  publish:
    runs-on: ubuntu-24.04
    environment: release
    needs: [build-wheels]
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lah dist

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && github.ref_name == 'test-publish'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
