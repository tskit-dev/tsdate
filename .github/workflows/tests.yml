name: Tests

on:
  pull_request:
  push:
    branches: [main, test]
  merge_group:

jobs:
  packaging:
    name: Python packaging
    permissions:
      contents: read
    uses: tskit-dev/.github/.github/workflows/python-packaging.yml@v22
    with:
      cli-test-cmd: tsdate --help

  test-c:
    name: C tests
    permissions:
      contents: read
    uses: tskit-dev/.github/.github/workflows/c-tests.yml@v22
    with:
      library-directory: lib
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-python-c:
    name: Python-C tests
    permissions:
      contents: read
    uses: tskit-dev/.github/.github/workflows/python-c-tests.yml@v22
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Python
    permissions:
      contents: read
    uses: tskit-dev/.github/.github/workflows/python-tests.yml@v22
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python }}
      coverage-directory: tsdate
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        python: ["3.11", "3.13"]
        os: [macos-latest, ubuntu-24.04, windows-latest]
